<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DosiCare Pro - Prescripción Multi-Medicamento (Autónomo)</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #e0e7ff;
            --surface: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --warning-bg: #fffbeb;
            --warning-border: #f59e0b;
            --danger-bg: #fef2f2;
            --danger-border: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: var(--text-dark);
            padding: 30px 15px;
            min-height: 100vh;
        }

        .wrapper {
            max-width: 960px;
            margin: 0 auto;
        }

        .card {
            background: var(--surface);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            overflow: hidden;
            margin-bottom: 25px;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header p {
            color: var(--primary-light);
            font-size: 14px;
        }

        .status-badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            text-transform: uppercase;
            margin-top: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .form-body {
            padding: 25px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 15px;
            padding-bottom: 6px;
            border-bottom: 2px solid var(--primary-light);
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .grid-med {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-dark);
            background: #fff;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .med-row {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            position: relative;
            margin-bottom: 15px;
        }

        .btn-add {
            background: transparent;
            color: var(--primary);
            border: 2px dashed var(--primary);
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .btn-add:hover {
            background: var(--primary-light);
        }

        .btn-submit {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background: #4338ca;
        }

        .btn-remove {
            background: var(--danger-bg);
            color: var(--danger-border);
            border: 1px solid var(--danger-border);
            padding: 9px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        .btn-remove:hover {
            background: #fee2e2;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }

        th {
            background: #f1f5f9;
            color: var(--text-dark);
            font-weight: 600;
            text-align: left;
            padding: 12px;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            color: var(--text-dark);
        }

        tr:hover {
            background: #f8fafc;
        }

        .alert-box {
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }

        .alert-warning {
            background: var(--warning-bg);
            border-left: 4px solid var(--warning-border);
            color: #92400e;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- Encabezado Principal -->
    <div class="card">
        <div class="header">
            <h1>DosiCare Pro · Prescripción Médica Multi-Fármaco</h1>
            <p>Gestión de dosis por peso, horarios en formato militar y alertas autónomas locales</p>
            <div class="status-badge">Modo Local Autónomo Activo</div>
        </div>
    </div>

    <form id="prescriptionForm" onsubmit="procesarPrescripcion(event)">
        <!-- Sección 1: Datos del Paciente -->
        <div class="card">
            <div class="form-body">
                <div class="section-title">1. Datos del Paciente</div>
                <div class="grid-3">
                    <div class="form-group">
                        <label for="pacienteNombre">Nombre del Paciente</label>
                        <input type="text" id="pacienteNombre" value="Lina Lopez" required>
                    </div>
                    <div class="form-group">
                        <label for="pacienteEdad">Edad (Años)</label>
                        <input type="number" id="pacienteEdad" value="11" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="pacientePeso">Peso Corporal (kg)</label>
                        <input type="number" id="pacientePeso" value="45.0" step="0.1" min="0" required>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sección 2: Medicamentos -->
        <div class="card">
            <div class="form-body">
                <div class="section-title">2. Medicamentos a Prescribir</div>
                
                <div id="medicamentosContainer">
                    <!-- Fila de medicamento por defecto -->
                    <div class="med-row">
                        <div class="grid-med">
                            <div class="form-group">
                                <label>Medicamento / Fármaco</label>
                                <input type="text" placeholder="Ej. Acetaminofén (Jarabe o Tabletas)" required class="med-nombre">
                            </div>
                            <div class="form-group">
                                <label>Dosis Requerida</label>
                                <input type="text" placeholder="Ej. 500mg o 5ml" required class="med-dosis">
                            </div>
                            <div class="form-group">
                                <label>Frecuencia (Horas)</label>
                                <select class="med-frecuencia">
                                    <option value="4">Cada 4 horas</option>
                                    <option value="6">Cada 6 horas</option>
                                    <option value="8" selected>Cada 8 horas</option>
                                    <option value="12">Cada 12 horas</option>
                                    <option value="24">Cada 24 horas (Diario)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Duración (Días)</label>
                                <input type="number" value="3" min="1" required class="med-duracion">
                            </div>
                        </div>
                        <div style="text-align: right; margin-top: 5px;">
                            <button type="button" class="btn-remove" onclick="eliminarFila(this)">Eliminar</button>
                        </div>
                    </div>
                </div>

                <button type="button" class="btn-add" onclick="agregarFila()">
